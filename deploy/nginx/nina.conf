# Host nginx for NINA. Install to /etc/nginx/sites-available/nina and symlink
# into sites-enabled. ONE hostname per tenant carries the tenant via the Host
# header, so this same block serves the apex AND every *.yourdomain.com.
#
# Routing within a tenant host:
#   /api, /admin, /static, /media, /healthz, /readyz, bot webhooks -> Django (8000)
#   everything else                                                 -> Next.js (3000)
#
# HTTP-first bring-up. For wildcard TLS later, see deploy/README-tls.md and wrap
# the location blocks in a `listen 443 ssl;` server that points at the wildcard cert.

upstream nina_backend  { server 127.0.0.1:8000; }
upstream nina_frontend { server 127.0.0.1:3000; }

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com *.yourdomain.com;

    client_max_body_size 10m;

    # --- Django: API, admin, health, static, and the bot webhooks ---
    location ~ ^/(api|admin|static|media|healthz|readyz)(/|$) {
        proxy_pass http://nina_backend;
        proxy_set_header Host              $host;          # tenant resolution depends on this
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;        # becomes https once TLS is on
        proxy_redirect off;
    }

    # --- Next.js: panel, public booking page, onboarding, everything else ---
    location / {
        proxy_pass http://nina_frontend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;          # HMR / websockets
        proxy_set_header Connection "upgrade";
        proxy_redirect off;
    }
}
