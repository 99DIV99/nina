name: backend-deploy

# Runs only after backend-ci succeeds on the default branch.
on:
  workflow_run:
    workflows: ["backend-ci"]
    types: [completed]
    branches: [main, master]

concurrency:
  group: nina-deploy # shared with frontend-deploy: never touch the stack concurrently
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy backend services in the unified stack
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/nina/backend
            git config --global --add safe.directory /opt/nina/backend
            git pull --ff-only origin master
            CO="docker compose -f docker-compose.prod.yml --env-file .env.prod"
            # Rebuild/refresh only the backend-owned services + datastores.
            $CO up -d --build db redis web worker beat
            bash deploy/release.sh
            docker image prune -f
