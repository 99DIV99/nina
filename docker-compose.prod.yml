# Unified production stack: frontend + backend (web/worker/beat) + Postgres +
# Redis, in ONE compose. The backend repo is the orchestrator; the frontend is
# built from the sibling clone at ../frontend. Host nginx proxies to the two
# published localhost ports (8000 backend, 3000 frontend).
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Migrations/collectstatic are not auto-run (so the 3 backend services don't race
# on the DB) — run deploy/release.sh after `up`.

name: nina

services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: .env.prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: nina-backend:latest
    restart: unless-stopped
    env_file: .env.prod
    environment:
      POSTGRES_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    image: nina-backend:latest
    restart: unless-stopped
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency", "2"]
    env_file: .env.prod
    environment:
      POSTGRES_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      - web
      - redis

  beat:
    image: nina-backend:latest
    restart: unless-stopped
    command: ["celery", "-A", "config", "beat", "-l", "info",
              "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    env_file: .env.prod
    environment:
      POSTGRES_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      - web
      - redis

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NINA_BASE_DOMAIN: ${NINA_BASE_DOMAIN}
        NINA_API_PROTO: ${NINA_API_PROTO}
        NINA_API_PORT: ${NINA_API_PORT}
        NINA_API_BASE: ${NINA_API_BASE}
    image: nina-frontend:latest
    restart: unless-stopped
    env_file: .env.prod
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0" # must bind all interfaces inside the container
    # Reliable public resolvers: server-side calls reach the backend via the
    # tenant hostname (Host header carries the tenant); the default container
    # resolver was intermittently failing to resolve *.sslip.io (EAI_AGAIN).
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - web

volumes:
  pgdata:
  redisdata:
  staticfiles:
  media:
